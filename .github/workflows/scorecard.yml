name: Supply-chain scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Results stay in this repository's code-scanning view. Publishing to
          # the public OpenSSF API is an owner decision, not an automated one.
          publish_results: false
      - uses: github/codeql-action/upload-sarif@c23de5a82f64bb08c6d9f28844551440ca298e76 # v4.38.1
        with:
          sarif_file: scorecard.sarif
