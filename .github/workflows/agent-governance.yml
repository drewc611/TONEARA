name: Agent governance

on:
  pull_request:
    paths:
      - '.github/agents/**'
      - '.github/copilot-instructions.md'
      - 'docs/AGENT_OPERATING_MODEL.md'

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate agent boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/AGENT_OPERATING_MODEL.md
          test -f .github/copilot-instructions.md
          count=$(find .github/agents -name '*.agent.md' | wc -l)
          test "$count" -ge 7
          for file in .github/agents/*.agent.md; do
            grep -q '^description:' "$file"
            grep -qiE 'never|may not|do not' "$file"
          done
